openapi: 3.0.3
info:
  title: IELTS Proctoring API (Go port)
  version: 1.0.0
  description: |-
    Wire contract for the Go backend (module example.com/ielts-proctoring).
    Error envelope is uniform: {code, message, details?, requestId}.
    Every response carries the X-Request-Id header (client may supply one;
    the server mints a UUID when absent). Timestamps are UTC RFC3339 with
    microseconds; money-free integer scores only.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: student-v2
  - name: terminalization
  - name: proctor
  - name: grading
  - name: results
  - name: sat
  - name: act
paths:
  /auth/login:
    post:
      security: []
      tags: [auth]
      summary: Staff login
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session issued
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/Actor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/student/entry:
    post:
      security: []
      tags: [auth]
      summary: Student entry by access code (free by default; any active account, any non-empty code)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wcode, email]
              properties:
                wcode: { type: string, description: 'Free-form access code (still required): W123456, alice, guest-alpha_01, ...', example: alice }
                email: { type: string, format: email }
      responses:
        "200":
          description: Attempt token issued
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  attemptToken: { type: string }
                  attemptId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/student/schedules/{id}:
    get:
      security: []
      tags: [auth]
      summary: Read schedule metadata for public student entry
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Schedule metadata
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/session:
    get:
      tags: [auth]
      summary: Current session
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Session
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/Actor" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Logged out
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v2/student/attempts/{attemptId}/responses:batch:
    servers:
      - url: /
    post:
      security:
        - attemptBearer: []
      tags: [student-v2]
      summary: V2 batch save (also mounted at /v2/student/attempts/{attemptId}/responses:batch)
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2BatchRequest" }
      responses:
        "200":
          description: Accepted or exact replay
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2BatchResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v2/student/attempts/{attemptId}/submit:
    servers:
      - url: /
    post:
      security:
        - attemptBearer: []
      tags: [student-v2]
      summary: V2 submit (also mounted at /v2/student/attempts/{attemptId}/submit)
      description: |-
        Lock attempt, identity/session, receipt replay, global submission
        ownership, epochs, active session, expected_revision==response_revision
        else VERSION_COLLISION, runtime gate + writability, final commands,
        digest, submitted_at=now (DB clock). SAT parks a provisional receipt;
        IELTS/ACT seal submitted/student_submit first, then digest UPDATE.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2SubmitRequest" }
      responses:
        "200":
          description: Submitted (provisional for SAT) or replayed receipt
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2SubmitResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v2/student/attempts/{attemptId}/takeover:
    servers:
      - url: /
    post:
      security:
        - attemptBearer: []
      tags: [student-v2]
      summary: Writer-lease takeover to a new client session
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientSessionId, reason]
              properties:
                clientSessionId: { type: string, maxLength: 36 }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Lease moved
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  attemptId: { type: string }
                  clientSessionId: { type: string }
                  leaseEpoch: { type: integer, format: int64, minimum: 1 }
                  expiresAt: { type: string, format: date-time }
                  token: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/student/attempts/{attemptId}/responses:
    servers:
      - url: /
    get:
      security:
        - attemptBearer: []
      tags: [student-v2]
      summary: V2 snapshot recovery
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: Snapshot
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Snapshot" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/bootstrap:
    post:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: SAT delivery bootstrap (sections, modules, questions, attempt snapshot)
      description: |-
        Attempt-bearer route. The bearer schedule claim must match the URL
        scheduleId else 403. Provider must be sat else 422. Returns the
        content tree plus attempt snapshot, control, timing, and result.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bootstrap payload
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryBootstrap" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/responses/{examQuestionId}:
    patch:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: SAT delivery save response (writer-claim fenced)
      description: |-
        Attempt-bearer route. Revision CAS: exact-replay of the stored
        row returns 200; stale revision returns 409
        RESPONSE_REVISION_MISMATCH; superseded writer session returns
        409 ACTIVE_SESSION_SUPERSEDED.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: examQuestionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryResponseRequest" }
      responses:
        "200":
          description: Saved snapshot
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResponseSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/modules/start:
    post:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: SAT delivery start module (idempotent active-restart)
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryModuleStartRequest" }
      responses:
        "200":
          description: Started module
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/modules/submit:
    post:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: SAT delivery submit module
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryModuleSubmitRequest" }
      responses:
        "200":
          description: Submitted module
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/submit:
    post:
      tags: [terminalization]
      summary: SAT complete_assessment (true terminal seal)
      description: |-
        Proctor/receipt terminated => ATTEMPT_PROCTOR_BLOCKED; submission
        idempotency re-seals submitted/sat_complete; all modules must be
        submitted|locked else 409; scores and seals sat_complete.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId, submissionId]
              properties:
                attemptId: { type: string }
                submissionId: { type: string, maxLength: 36 }
      responses:
        "200":
          description: Assessment result
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /proctor/sessions:
    get:
      tags: [proctor]
      summary: List proctor session summaries
      description: |-
        Admin/Observer see all schedules; Proctor sees assigned schedules
        only. ?providerKey= filters to sat|ielts|act (422 otherwise).
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: providerKey
          in: query
          required: false
          schema: { type: string, enum: [sat, ielts, act] }
      responses:
        "200":
          description: Session summaries
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /proctor/sessions/{scheduleId}:
    get:
      tags: [proctor]
      summary: Proctor session detail
      description: |-
        Schedule + runtime + student sessions + audit/alert logs + notes +
        presence + violation rules + degraded flag. ?mode=dashboard switches
        audit/alert limits (defaults 200/100). Proctors outside the schedule
        assignment get 404.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: mode
          in: query
          required: false
          schema: { type: string }
        - name: auditLimit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: alertLimit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Session detail
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proctor/notes:
    get:
      tags: [proctor]
      summary: List all proctor session notes
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /proctor/notes/{noteId}:
    delete:
      tags: [proctor]
      summary: Delete a proctor note by id
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proctor/sessions/{scheduleId}/notes:
    get:
      tags: [proctor]
      summary: List notes for a proctor session
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [proctor]
      summary: Create a proctor session note
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, content]
              properties:
                category: { type: string }
                content: { type: string }
                isResolved: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /proctor/sessions/{scheduleId}/notes/{noteId}:
    put:
      tags: [proctor]
      summary: Replace a proctor session note
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          {
            description: Saved,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    patch:
      tags: [proctor]
      summary: Update a proctor session note
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          {
            description: Saved,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [proctor]
      summary: Delete a proctor session note
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proctor/sessions/{scheduleId}/violation-rules:
    get:
      tags: [proctor]
      summary: List violation rules for a proctor session
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Violation rules
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [proctor]
      summary: Create a violation rule
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationRuleMutation" }
      responses:
        "201":
          {
            description: Created,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /proctor/sessions/{scheduleId}/violation-rules/{ruleId}:
    put:
      tags: [proctor]
      summary: Replace a violation rule
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationRuleMutation" }
      responses:
        "200":
          {
            description: Saved,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    patch:
      tags: [proctor]
      summary: Update a violation rule
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViolationRuleMutation" }
      responses:
        "200":
          {
            description: Saved,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [proctor]
      summary: Delete a violation rule
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proctor/violation-rules/{ruleId}:
    delete:
      tags: [proctor]
      summary: Delete a violation rule by id
      parameters:
        - $ref: "#/components/parameters/RequestId"
