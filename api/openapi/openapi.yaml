openapi: 3.0.3
info:
  title: IELTS Proctoring API (Go port)
  version: 1.0.0
  description: |-
    Wire contract for the Go backend (module example.com/ielts-proctoring).
    Error envelope is uniform: {code, message, details?, requestId}.
    Every response carries the X-Request-Id header (client may supply one;
    the server mints a UUID when absent). Timestamps are UTC RFC3339 with
    microseconds; money-free integer scores only.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: student-v2
  - name: terminalization
  - name: proctor
  - name: grading
  - name: results
  - name: score-conversion
  - name: sat
  - name: act
paths:
  /auth/login:
    post:
      security: []
      tags: [auth]
      summary: Staff login
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Session issued
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/Actor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/student/entry:
    post:
      security: []
      tags: [auth]
      summary: Practice self-registration with an isolated sitting principal
      description: |-
        Direct entry accepts a nonempty practice code on an open schedule.
        Access-link entry additionally enforces link lifecycle, window and scope.
        Display name/email label a practice attempt; they do not authenticate an
        existing account. Anonymous clients retain a cryptographically random
        entrySession before their first request and reuse it after response loss.
        Existing-account association requires an authenticated student session
        with matching account email and CSRF proof. Missing legacy recovery
        capabilities receive an actionable validation response, never account
        authority. Admitted-attempt resume is separate from new admission.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wcode, email, studentName]
              properties:
                scheduleId: { type: string }
                accessLinkId: { type: string }
                wcode: { type: string, description: 'Practice sitting code; empty only for open access links.' }
                email: { type: string, format: email, description: 'Display/contact label, not authentication.' }
                studentName: { type: string }
                clientSessionId: { type: string, format: uuid }
                entrySession: { type: string, pattern: '^[a-fA-F0-9]{64}$', description: '32-byte opaque recovery capability required for anonymous practice entry. Keep private and retain across retries.' }
      responses:
        "200":
          description: Attempt token issued
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  attemptToken: { type: string }
                  attemptId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/student/schedules/{id}:
    get:
      security: []
      tags: [auth]
      summary: Read schedule metadata for public student entry
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Schedule metadata
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/session:
    get:
      tags: [auth]
      summary: Current session
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Session
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/Actor" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Logged out
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v2/student/attempts/{attemptId}/responses:batch:
    servers:
      - url: /
    post:
      security:
        - attemptBearer: []
      tags: [student-v2]
      summary: V2 batch save (also mounted at /v2/student/attempts/{attemptId}/responses:batch)
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2BatchRequest" }
      responses:
        "200":
          description: Accepted or exact replay
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2BatchResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v2/student/attempts/{attemptId}/submit:
    servers:
      - url: /
    post:
      security:
        - attemptBearer: []
      tags: [student-v2]
      summary: V2 submit (also mounted at /v2/student/attempts/{attemptId}/submit)
      description: |-
        Lock attempt, identity/session, receipt replay, global submission
        ownership, epochs, active session, expected_revision==response_revision
        else VERSION_COLLISION, runtime gate + writability, final commands,
        digest, submitted_at=now (DB clock). SAT parks a provisional receipt;
        IELTS/ACT seal submitted/student_submit first, then digest UPDATE.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2SubmitRequest" }
      responses:
        "200":
          description: Submitted (provisional for SAT) or replayed receipt
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2SubmitResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v2/student/attempts/{attemptId}/takeover:
    servers:
      - url: /
    post:
      security:
        - attemptBearer: []
      tags: [student-v2]
      summary: Writer-lease takeover to a new client session
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientSessionId, reason]
              properties:
                clientSessionId: { type: string, maxLength: 36 }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Lease moved
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  attemptId: { type: string }
                  clientSessionId: { type: string }
                  leaseEpoch: { type: integer, format: int64, minimum: 1 }
                  expiresAt: { type: string, format: date-time }
                  token: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v2/student/attempts/{attemptId}/responses:
    servers:
      - url: /
    get:
      security:
        - attemptBearer: []
      tags: [student-v2]
      summary: V2 snapshot recovery
      description: |-
        Read path: the bearer is verified HMAC + expiry plus a live
        attempt_sessions touch (token_id/revoked_at/lease_epoch) in both
        verify modes, so revoked or takeover-rotated bearers render 401
        even when ATTEMPT_VERIFY=stateless.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: Snapshot
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Snapshot" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/bootstrap:
    post:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: SAT delivery bootstrap (sections, modules, questions, attempt snapshot)
      description: |-
        Attempt-bearer route. The bearer schedule claim must match the URL
        scheduleId else 403. Provider must be sat else 422. Returns the
        content tree plus attempt snapshot, control, timing, and result.
        Read path: revoked or takeover-rotated bearers render 401 in both
        verify modes (live attempt_sessions touch, never skipped on reads).
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bootstrap payload
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryBootstrap" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/answered-exam:
    get:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: Answered exam of the bearer's own completed SAT attempt
      description: |-
        Print projection (docs/sat-result.md §4–5): the attempt's pinned
        published version narrowed to the modules it started, with accepted
        responses; no answer keys, rationales or scoring rules. The attempt
        comes from the bearer; the URL scheduleId must match it (403). Open
        only while the attempt's score report is visible (403), after the
        attempt is terminal (409). 429 with Retry-After when the server's
        build bound is full. Cache-Control: no-store.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Answered exam (keyless)
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnsweredExam" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/responses/{examQuestionId}:
    patch:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: SAT delivery save response (writer-claim fenced)
      description: |-
        Attempt-bearer route. Revision CAS: exact-replay of the stored
        row returns 200; stale revision returns 409
        RESPONSE_REVISION_MISMATCH; superseded writer session returns
        409 ACTIVE_SESSION_SUPERSEDED. Conflict reasons ride
        details.reason on code ASSESSMENT_CONFLICT (409): ATTEMPT_TERMINAL
        (attempt already submitted/terminated/locked/cancelled or
        post-exam — stop retrying, re-bootstrap), SECTION_CLOCK_MISSING
        (authoritative cohort section clock row missing or unstarted —
        operator/data issue, safe to retry after cohort start), plus
        RUNTIME_PAUSED / RUNTIME_NOT_LIVE / DEADLINE_EXPIRED /
        MODULE_MISMATCH / STAGE_SECTION_MISMATCH /
        RESPONSE_REVISION_MISMATCH / ATTEMPT_PROCTOR_BLOCKED.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: examQuestionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryResponseRequest" }
      responses:
        "200":
          description: Saved snapshot
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResponseSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/modules/start:
    post:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: SAT delivery start module (idempotent active-restart)
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryModuleStartRequest" }
      responses:
        "200":
          description: Started module
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/start-with-code:
    post:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: SAT access-code start (individual first entry)
      description: >-
        Redeems the six-digit session start code for the bearer's own attempt
        and starts only that candidate's first delivered module at DB time.
        The attempt comes from the verified credential and the module from the
        delivered order; identity/module selectors are rejected. A started
        attempt replays as `resume` at its current module without re-checking
        the code.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SatStartWithCodeRequest" }
      responses:
        "200":
          description: Started (entry ACK with first-module content) or resume (bootstrap)
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SatStartWithCodeResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/modules/submit:
    post:
      security:
        - attemptBearer: []
      tags: [delivery]
      summary: SAT delivery submit module
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryModuleSubmitRequest" }
      responses:
        "200":
          description: Submitted module
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /assessment-delivery/schedules/{scheduleId}/submit:
    post:
      tags: [terminalization]
      summary: SAT complete_assessment (true terminal seal)
      description: |-
        Proctor/receipt terminated => ATTEMPT_PROCTOR_BLOCKED; submission
        idempotency re-seals submitted/sat_complete; all modules must be
        submitted|locked else 409; scores and seals sat_complete.
        Terminal-attempt writes render 409 ASSESSMENT_CONFLICT with
        details.reason ATTEMPT_TERMINAL; a missing cohort section clock
        renders details.reason SECTION_CLOCK_MISSING.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attemptId, submissionId]
              properties:
                attemptId: { type: string }
                submissionId: { type: string, maxLength: 36 }
      responses:
        "200":
          description: Assessment result
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /proctor/sessions:
    get:
      tags: [proctor]
      summary: List proctor session summaries
      description: |-
        Admin/Observer see all schedules; Proctor sees assigned schedules
        only. ?providerKey= filters to sat|ielts|act (422 otherwise).
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: providerKey
          in: query
          required: false
          schema: { type: string, enum: [sat, ielts, act] }
      responses:
        "200":
          description: Session summaries
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /proctor/sessions/{scheduleId}:
    get:
      tags: [proctor]
      summary: Proctor session detail
      description: |-
        Schedule + runtime + student sessions + audit/alert logs + notes +
        presence + violation rules + degraded flag. ?mode=dashboard switches
        audit/alert limits (defaults 200/100). Proctors outside the schedule
        assignment get 404.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: mode
          in: query
          required: false
          schema: { type: string }
        - name: auditLimit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: alertLimit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Session detail
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proctor/notes:
    get:
      tags: [proctor]
      summary: List all proctor session notes
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /proctor/notes/{noteId}:
    delete:
      tags: [proctor]
      summary: Delete a proctor note by id
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /proctor/sessions/{scheduleId}/notes:
    get:
      tags: [proctor]
      summary: List notes for a proctor session
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [proctor]
      summary: Create a proctor session note
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, content]
              properties:
                category: { type: string }
                content: { type: string }
                isResolved: { type: boolean }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /proctor/sessions/{scheduleId}/notes/{noteId}:
    put:
      tags: [proctor]
      summary: Replace a proctor session note
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          {
            description: Saved,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    patch:
      tags: [proctor]
      summary: Update a proctor session note
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: noteId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          {
            description: Saved,
            content: { application/json: { schema: { type: object, additionalProperties: true } } },
