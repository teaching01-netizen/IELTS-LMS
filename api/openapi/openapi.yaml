        `scheduleId` and `topic` query parameters are authorized against the
        authenticated user's schedule assignments or student registration;
        topic names never grant access by themselves.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: query
          required: false
          schema: { type: string }
        - name: topic
          in: query
          required: false
          schema: { type: string }
      responses:
        "101": { description: Websocket protocol upgrade }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
