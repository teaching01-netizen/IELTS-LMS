  /assessment-authoring/question-revisions/{revisionId}/fields:
    patch:
      tags: [authoring]
      summary: Partially update non-collaborative question revision fields
      description: |
        Partial, allow-listed field update used while prompt co-editing is
        active. `prompt` is structurally absent from the request type: this
        endpoint cannot overwrite a collaborative prompt. On a stale revision
        the client refetches and retries only when the fields it is saving
        were not changed remotely.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: revisionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assessment-authoring/exam-questions/{examQuestionId}/coedit-token:
    post:
      tags: [authoring]
      summary: Issue a short-lived prompt co-editing token
      description: |
        Creates or loads the collaborative prompt document for the selected
        question in the current editable draft and returns a five-minute
        HMAC-SHA256 token plus the opaque document name and service URL. The
        browser never constructs the room name from raw identifiers. Observers
        receive a read-mode token.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: examQuestionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token issued
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /assessment-authoring/exams/{examId}/coedit-token:
    post:
      tags: [authoring]
      summary: Issue an exam-workspace co-editing token
      description: |
        Issues a short-lived token for the exam-level SAT authoring workspace
        document. The workspace room is keyed by the active editable draft;
        the browser never constructs the room name from raw identifiers.
        Observers receive a read-mode token.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: examId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token issued
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/authoring-coedit/load:
    post:
      tags: [authoring-coedit-internal]
      summary: Load a collaborative document (private)
      description: |
        Private endpoint called by the singleton Hocuspocus service. Requests
        are authenticated by an HMAC over method, path, timestamp, and body
        hash using AUTHORING_COEDIT_SERVICE_SECRET; a browser never holds that
        secret. Not part of the public client contract.
      responses:
        "200":
          description: Document state or seed
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /internal/authoring-coedit/initialize:
    post:
      tags: [authoring-coedit-internal]
      summary: Seed a collaborative document (private)
      description: |
        Stores freshly seeded binary Yjs state without bumping the question
        revision, because the materialized prompt is unchanged by seeding.
      responses:
        "200":
          description: Seeded
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /internal/authoring-coedit/store:
    post:
      tags: [authoring-coedit-internal]
      summary: Commit collaborative prompt state (private)
      description: |
        Commits the Yjs binary state, state vector, state hash, and prompt
        projection in the same MySQL transaction as the question revision bump
        and the content-free authoring event. A previous-hash mismatch is
        refused. Same-hash replay is acknowledged without a revision bump.
      responses:
        "200":
          description: Committed or already current
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /internal/authoring-coedit/final-store:
    post:
      tags: [authoring-coedit-internal]
      summary: Commit the last state owned by a lifecycle freeze (private)
      description: |
        Operation-owned final store for a room that is durably fenced in
        freezing state. The operation ID is required and the row remains
        fenced until the Go lifecycle owner closes or aborts it.
      responses:
        "200":
          description: Final state committed or already current
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /internal/authoring-coedit/rebase:
    post:
      tags: [authoring-coedit-internal]
      summary: Install a compacted durable Yjs state (private)
      description: |
        Compare-and-set rebase guarded by the expected state hash and epoch.
        It changes only durable binary state and counters; domain projections
        and question revisions are preserved.
      responses:
        "200":
          description: Rebased state committed
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /internal/authoring-coedit/recover:
    post:
      tags: [authoring-coedit-internal]
      summary: Recover expired durable freeze rows (private)
      description: |
        Idempotently reopens only expired freezing rows. Ambiguous frozen rows
        are never reopened automatically.
      responses:
        "200":
          description: Recovery counts
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
