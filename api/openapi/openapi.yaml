      summary: Save a draft under an optimistic lock (incomplete cells allowed)
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: true
          description: The draft `version` the edit was based on.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { $ref: "#/components/schemas/SATScoreConversionContent" }
                calibrationSource: { type: string, maxLength: 500 }
                note: { type: string, maxLength: 1000 }
              additionalProperties: false
      responses:
        "200":
          description: Saved draft (version incremented)
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SATScoreConversionRevision" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
