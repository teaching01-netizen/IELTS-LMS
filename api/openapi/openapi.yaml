      summary: Assign Module 2 for a staff_selects SAT classroom student
      description: >-
        Commits the route decision and the selected Module 2 attempt together.
        An identical repeat returns the committed decision; a different choice
        after commit is a 409.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sectionKey, route]
              properties:
                sectionKey: { type: string }
                route: { type: string, enum: [lower, higher] }
      responses:
        "200":
          description: The committed Module 2 assignment
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  sectionKey: { type: string }
                  route: { type: string, enum: [lower, higher] }
                  selectedModuleId: { type: string }
                  replayed: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
