      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: examId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: XLSX workbook template
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Content-Disposition: { schema: { type: string } }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /assessment-authoring/exams/{examId}/sat-workbook-preview:
    post:
      tags: [authoring]
      summary: Preview SAT workbook import
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: examId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                mode: { type: string, enum: [full, single_module], description: Omit to preserve complete-workbook mode. }
                targetModuleKey:
                  type: string
                  enum: [rw-m1, rw-m2-lower, rw-m2-higher, math-m1, math-m2-lower, math-m2-higher]
                  description: Required when mode is single_module.
      responses:
        "200":
          description: Preview
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [full, single_module] }
                  targetModuleKey: { type: string, nullable: true }
                  commitReady: { type: boolean, description: Single-module previews require an explicit pretest resolution before commit. }
                  ignoredScaffoldRows: { type: integer }
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        questions:
                          type: array
                          items:
                            type: object
                            properties:
                              isPretest: { type: boolean, nullable: true, description: null means the workbook did not designate this question. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /assessment-authoring/exams/{examId}/sat-workbook-commit:
    post:
      tags: [authoring]
      summary: Commit SAT workbook import
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: examId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importId, expectedVersionId, expectedVersionRevision, modules]
              properties:
                mode: { type: string, enum: [full, single_module], description: Omit to preserve complete-workbook mode. }
                targetModuleKey:
                  type: string
                  enum: [rw-m1, rw-m2-lower, rw-m2-higher, math-m1, math-m2-lower, math-m2-higher]
                pretestResolution:
                  type: object
                  required: [selectedOrders, designationSource, confirmed]
                  properties:
                    selectedOrders: { type: array, minItems: 2, maxItems: 2, uniqueItems: true, items: { type: integer, minimum: 1 } }
                    designationSource: { type: string, enum: [source_verified, staff_defined] }
                    confirmed: { type: boolean, enum: [true] }
                importId: { type: string }
                expectedVersionId: { type: string }
                expectedVersionRevision: { type: integer, minimum: 0 }
                modules: { type: array, items: { type: object } }
                assets: { type: array, items: { type: object } }
                operationKey: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Committed
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
