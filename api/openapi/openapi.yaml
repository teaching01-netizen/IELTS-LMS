      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section, topology, m1]
              properties:
                draftId: { type: string }
                revisionId: { type: string }
                section: { type: string, enum: [reading-writing, math] }
                topology: { type: string, enum: [full_lower, full_higher, m2_lower_only, m2_higher_only] }
                m1: { type: integer }
                m2: { type: integer }
                m1Operational: { type: integer }
                m2Operational: { type: integer }
