      summary: Old-versus-new report over every released SAT result (bounded histogram; reads only)
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Impact report
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SATScoreConversionImpact" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /sat-score-conversion/drafts/{id}/publish:
    post:
      tags: [sat, score-conversion]
      summary: Activate a draft atomically; every released SAT result then resolves against it
      description: >-
        409 STALE_BASE when another revision was published after the draft was
        created; 409 REVISION_SUPERSEDED for a published-but-inactive revision;
        422 with `details.errors` for validation failures. Re-publishing the
        active revision returns 200 with `alreadyActive: true`.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [revision, alreadyActive]
                properties:
                  revision: { $ref: "#/components/schemas/SATScoreConversionRevision" }
                  alreadyActive: { type: boolean }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Staff session cookie (Secure HttpOnly SameSite Strict). Mutating routes additionally require the X-Csrf-Token header.
    csrfToken:
      type: apiKey
      in: header
      name: X-Csrf-Token
      description: CSRF token bound to the session, required on cookie-authenticated mutations.
    attemptBearer:
      type: http
      scheme: bearer
      bearerFormat: attempt-token
      description: |-
        V2 student attempt token binding user schedule attempt and
        session claims. Delivery mutations (responses/start/submit)
        additionally gate on the exclusive writer claim: a superseded
        writer session receives 409 ACTIVE_SESSION_SUPERSEDED with
        details.reason.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client-supplied request id; server mints a UUID when absent and always echoes it.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Retry-safety key for create/duplicate/batch/bulk/workbook-commit/publish.
        A retry with the same key and identical content replays the original
        outcome; reuse with different content is a 409. An `operationKey` body
        field is accepted as an equivalent on the same routes. 1-128 chars.
      schema: { type: string, minLength: 1, maxLength: 128 }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string }
  headers:
    RequestId:
      description: Echoed request id for every response.
      schema: { type: string }
  responses:
    Error:
      description: Stable error envelope
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Rate-limit denial; retry after the advertised number of seconds.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
        Retry-After:
          description: Integer number of seconds before the client should retry.
          required: true
          schema: { type: integer, format: int32, minimum: 1 }
        X-RateLimit-Tier:
          description: Low-cardinality limiter tier that denied the request.
          required: false
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    SATScoreConversionScore:
      type: object
      required: [low, high]
      properties:
        low: { type: integer, minimum: 200, maximum: 800 }
        high: { type: integer, minimum: 200, maximum: 800 }
    SATScoreConversionContent:
      type: object
      description: >-
        Both subjects. A full topology resolves through a matrix indexed
        cells[module1Correct][module2Correct]; a standalone Module 2 through its
        own 1D table. Dimensions must equal the attempt's operational counts.
        Null cells are legal only in drafts.
      required: [schemaVersion, sections]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        sections:
          type: object
          additionalProperties:
            type: object
            required: [tables, assign]
            properties:
              tables:
                type: object
                additionalProperties:
                  type: object
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [matrix, module2] }
                    m1Operational: { type: integer }
                    m2Operational: { type: integer }
                    operational: { type: integer }
                    cells:
                      type: array
                      items:
                        type: array
                        items: { type: integer, nullable: true }
                    scores:
                      type: array
                      items:
                        nullable: true
                        oneOf:
                          - { type: integer }
                          - { $ref: "#/components/schemas/SATScoreConversionScore" }
              assign:
                type: object
                description: topology (full_lower, full_higher, m2_lower_only, m2_higher_only) to table ids
                additionalProperties:
                  type: array
                  items: { type: string }
    SATScoreConversionRevision:
      type: object
      required: [id, status, version, calibrationSource, note, createdBy, createdAt, updatedAt, active]
      properties:
        id: { type: string }
        revisionNumber: { type: integer, nullable: true }
        status: { type: string, enum: [draft, published] }
        baseRevisionId: { type: string, nullable: true }
        content: { $ref: "#/components/schemas/SATScoreConversionContent" }
        contentSha256: { type: string, nullable: true }
        calibrationSource: { type: string }
        note: { type: string }
        restoredFromId: { type: string, nullable: true }
        version: { type: integer }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time, nullable: true }
        publishedBy: { type: string, nullable: true }
        active: { type: boolean }
    SATScoreConversionSettings:
      type: object
      required: [drafts, blueprint]
      properties:
        active:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/SATScoreConversionRevision" }
        drafts:
          type: array
          items: { $ref: "#/components/schemas/SATScoreConversionRevision" }
        blueprint:
          type: object
          additionalProperties:
            type: object
            properties:
              m1Operational: { type: integer }
              m2Operational: { type: integer }
    SATScoreConversionIssue:
      type: object
      required: [code, path, message]
      properties:
        code: { type: string }
        path: { type: string, example: "sections.math.tables.t1.cells[3][4]" }
        message: { type: string }
        section: { type: string }
        tableId: { type: string }
        row: { type: integer }
        col: { type: integer }
    SATScoreConversionValidation:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/SATScoreConversionIssue" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/SATScoreConversionIssue" }
    SATScoreConversionLookup:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [converted, unavailable] }
        scaled: { $ref: "#/components/schemas/SATScoreConversionScore" }
        reason: { type: string }
    SATScoreConversionImpact:
      type: object
      required: [draftId, generatedAt, resultsConsidered, sections, topChanges]
      properties:
        draftId: { type: string }
        activeRevisionId: { type: string, nullable: true }
        generatedAt: { type: string, format: date-time }
        resultsConsidered: { type: integer }
        sections:
          type: object
          additionalProperties:
            type: object
            properties:
              considered: { type: integer }
              changed: { type: integer }
              unchanged: { type: integer }
              becomesUnavailable: { type: integer }
              becomesAvailable: { type: integer }
              minDelta: { type: integer, nullable: true }
              maxDelta: { type: integer, nullable: true }
        topChanges:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              section: { type: string }
              topology: { type: string }
              m1: { type: integer }
              m2: { type: integer, nullable: true }
              count: { type: integer }
              oldScore:
                nullable: true
                allOf: [{ $ref: "#/components/schemas/SATScoreConversionScore" }]
              newScore:
                nullable: true
                allOf: [{ $ref: "#/components/schemas/SATScoreConversionScore" }]
    ErrorEnvelope:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          example: VERSION_COLLISION
          enum:
            [
              BAD_REQUEST,
              VALIDATION_ERROR,
              UNAUTHORIZED,
              FORBIDDEN,
              NOT_FOUND,
              CONFLICT,
              RATE_LIMITED,
              RATE_LIMIT_EXCEEDED,
              PAYLOAD_TOO_LARGE,
              SERVICE_UNAVAILABLE,
              INTERNAL,
              CSRF_FAILED,
              CSRF_REJECTED,
              SESSION_EXPIRED,
              ATTEMPT_TOKEN_INVALID,
              ATTEMPT_TOKEN_EXPIRED,
              LEASE_FENCED,
              CONTROL_EPOCH_STALE,
              VERSION_COLLISION,
              WRITE_ID_CONFLICT,
              DEADLINE_EXPIRED,
              ATTEMPT_NOT_WRITABLE,
              ATTEMPT_PROCTOR_BLOCKED,
              TERMINALIZATION_CONFLICT,
              TERMINAL_INVARIANT_VIOLATION,
              SUBMISSION_ID_MISUSE,
              RESPONSE_REVISION_MISMATCH,
              RUNTIME_REVISION_STALE,
              LEASE_ACQUIRE_FAILED,
              ASSESSMENT_CONFLICT,
              ACTIVE_SESSION_SUPERSEDED,
              UNSUPPORTED_PROVIDER,
              INVALID_ASSESSMENT,
              ASSESSMENT_RELEASE_INVARIANT,
              PROTOCOL_UPGRADE_REQUIRED,
              SERVICE_RECOVERY_FAILED,
              SESSION_ALREADY_ACTIVE,
              TRANSFER_APPROVAL_REQUIRED,
              TRANSFER_EXPIRED,
              TRANSFER_CONFLICT,
              STALE_BASE,
              PRECONDITION_FAILED,
              PRECONDITION_REQUIRED,
              NOT_A_DRAFT,
              REVISION_SUPERSEDED,
            ]
        message: { type: string }
        details:
          type: object
          description: >-
            Rate-limit errors include retryAfterSeconds as integer seconds;
            tier denials also include the tier string. Other error codes may
            use additional domain-specific detail fields.
          properties:
            retryAfterSeconds: { type: integer, minimum: 1 }
            tier: { type: string }
          additionalProperties: true
        requestId: { type: string }
    DeviceTransfer:
      type: object
      description: >-
        SAT device-transfer request. Never carries client session ids,
        credentials, or answers.
      properties:
        requestId: { type: string }
        operationId: { type: string }
        attemptId: { type: string }
        scheduleId: { type: string }
        state: { type: string, enum: [pending, approved, committed, denied, cancelled, expired, conflicted] }
        policyStage: { type: string, enum: [pre_start, post_start] }
        reasonCode: { type: string }
        expectedLeaseEpoch: { type: integer }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        approvalKind: { type: string, nullable: true, enum: [current_writer, proctor] }
        approvedAt: { type: string, format: date-time, nullable: true }
        approvalExpiresAt: { type: string, format: date-time, nullable: true }
        unconfirmedRiskAcknowledged: { type: boolean }
        decisionReason: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        resultingLeaseEpoch: { type: integer, nullable: true }
        committedAt: { type: string, format: date-time, nullable: true }
        candidateId: { type: string, description: Proctor listing only }
        candidateName: { type: string, description: Proctor listing only }
        lastServerSaveAt: { type: string, format: date-time, nullable: true, description: Proctor listing only }
    Actor:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [student, proctor, admin, admin_observer, builder, grader] }
    ViolationRuleMutation:
      type: object
      required: [triggerType, threshold, action, isEnabled]
      properties:
        triggerType: { type: string }
        threshold: { type: integer, minimum: 0 }
        specificViolationType: { type: string, nullable: true }
        specificSeverity: { type: string, nullable: true }
        action: { type: string }
        isEnabled: { type: boolean }
    V2Command:
      type: object
      required: [writeId, questionId, clientVersion, response]
      properties:
        writeId: { type: string, maxLength: 64 }
        questionId: { type: string, maxLength: 255 }
        clientVersion: { type: integer, format: int64, minimum: 1 }
        response: { type: object, additionalProperties: true }
    V2BatchRequest:
      type: object
      required: [leaseEpoch, controlEpoch, commands]
      properties:
        leaseEpoch: { type: integer, format: int64, minimum: 1 }
        controlEpoch: { type: integer, format: int64, minimum: 1 }
        commands:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/V2Command" }
    V2BatchResponse:
      type: object
      required: [attemptRevision, serverTime, acknowledgements]
      properties:
        acknowledgements:
          type: array
          items:
            type: object
            properties:
              writeId: { type: string }
              questionId: { type: string }
              clientVersion: { type: integer, format: int64 }
              outcome: { type: string, enum: [applied, duplicate, superseded] }
              serverRevision: { type: integer, format: int64 }
              replayed: { type: boolean }
              canonicalResponse: { type: object, additionalProperties: true }
              contentHash: { type: string }
        attemptRevision: { type: integer, format: int64 }
        serverTime: { type: string, format: date-time }
    V2SubmitRequest:
      type: object
      required: [leaseEpoch, controlEpoch, submissionId, expectedAttemptRevision]
      properties:
        leaseEpoch: { type: integer, format: int64, minimum: 1 }
        controlEpoch: { type: integer, format: int64, minimum: 1 }
        submissionId: { type: string, maxLength: 64 }
        expectedAttemptRevision: { type: integer, format: int64, minimum: 0 }
        finalCommands:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/V2Command" }
    V2SubmitResponse:
      type: object
      required:
        [attemptId, submissionId, status, attemptRevision, finalResponseDigest, acknowledgements]
      properties:
        attemptId: { type: string }
        submissionId: { type: string }
        status: { type: string }
        attemptRevision: { type: integer, format: int64 }
        finalResponseDigest: { type: string }
        submittedAt: { type: string, format: date-time, nullable: true }
        acknowledgements:
          type: array
          items:
            type: object
            additionalProperties: true
    V2Snapshot:
      type: object
      properties:
        attemptId: { type: string }
        protocolVersion: { type: integer }
        deliveryStatus: { type: string }
        leaseEpoch: { type: integer, format: int64 }
        controlEpoch: { type: integer, format: int64 }
        attemptRevision: { type: integer, format: int64 }
        deadlineAt: { type: string, format: date-time, nullable: true }
        closingGraceUntil: { type: string, format: date-time, nullable: true }
        responses:
          type: array
          items:
            type: object
            additionalProperties: true
    DeliveryBootstrap:
      type: object
      properties:
        scheduleId: { type: string }
        examId: { type: string }
        providerKey: { type: string, example: sat }
        versionId: { type: string }
        serverNow: { type: string, format: date-time }
        candidateName: { type: string }
        scheduleRuntimeStatus: { type: string }
        timing: { type: object, additionalProperties: true }
        proctorStatus: { type: string }
        proctorNote: { type: string, nullable: true }
        deviceFingerprintHash: { type: string, nullable: true }
        sections: { type: array, items: { type: object } }
        attempt: { type: object, additionalProperties: true }
        result: { type: object, nullable: true }
    AnsweredExam:
      type: object
      required: [attemptId, examTitle, candidateName, versionId, sections, attempt]
      properties:
        attemptId: { type: string }
        examTitle: { type: string }
        candidateName: { type: string }
        versionId: { type: string }
        sections: { type: array, items: { type: object } }
        attempt: { type: object, additionalProperties: true }
    DeliveryResponseRequest:
      type: object
      required: [revision, markedForReview, eliminatedOptions, annotations]
      properties:
        revision: { type: integer, minimum: 0 }
        response: { type: object, nullable: true, additionalProperties: true }
        markedForReview: { type: boolean }
        eliminatedOptions: { type: array, items: { type: string } }
        annotations: { type: object, additionalProperties: true }
        moduleAttemptId: { type: string }
        stageKey: { type: string, nullable: true }
        runtimeRevision: { type: integer, nullable: true }
        clientWriteId: { type: string }
    DeliveryResponseSnapshot:
      type: object
      properties:
        id: { type: string }
        moduleAttemptId: { type: string }
        examQuestionId: { type: string }
        response: { type: object, nullable: true, additionalProperties: true }
        markedForReview: { type: boolean }
        eliminatedOptions: { type: array, items: { type: string } }
        annotations: { type: object, additionalProperties: true }
        revision: { type: integer }
    DeliveryModuleStartRequest:
      type: object
      required: [moduleId]
      properties:
        moduleId: { type: string }
    SatStartWithCodeRequest:
      type: object
      additionalProperties: false
      required: [code, controlEpoch]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$", description: "Six ASCII digits as a string (leading zeros preserved)" }
        controlEpoch: { type: integer, minimum: 0 }
    SatStartWithCodeResponse:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [started, resume] }
        entry: { type: object, description: "AssessmentModuleEntryStateAck with selectedSection (kind=started)" }
        bootstrap: { type: object, description: "Assessment delivery bootstrap (kind=resume)" }
    SatStartPolicy:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [proctor, access_code] }
        state: { type: string, enum: [code_required, started, closed] }
        opensAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        serverNow: { type: string, format: date-time }
        blockedReason: { type: string, enum: [not_open, paused, revoked, rate_limited] }
        retryAfterSeconds: { type: integer }
    SatStartCode:
      type: object
      required: [scheduleId, code, generation, opensAt, closesAt, status, acceptingNewStarts, serverNow]
      properties:
        scheduleId: { type: string }
        cohortName: { type: string }
        examTitle: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
        generation: { type: integer, minimum: 1 }
        opensAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        status: { type: string }
        acceptingNewStarts: { type: boolean }
        serverNow: { type: string, format: date-time }
        rotatedAt: { type: string, format: date-time }
    DeliveryModuleSubmitRequest:
      type: object
      required: [moduleId]
      properties:
        moduleId: { type: string }
    AssessmentResult:
      type: object
      properties:
        id: { type: string }
        submissionId: { type: string }
        providerKey: { type: string, example: sat }
        scoreKind: { type: string, enum: [practice] }
        totalScore: { type: integer, nullable: true }
        scorePayload: { type: object, additionalProperties: true }
        sections:
          type: array
          items: { $ref: "#/components/schemas/SATSection" }
    SATSection:
      type: object
      properties:
        sectionKey: { type: string, enum: [reading-writing, math] }
        route: { type: string, enum: [lower, higher], nullable: true }
        rawCorrect: { type: integer }
        operationalQuestionCount: { type: integer }
        scaledScore: { type: integer, nullable: true }
        details: { type: object, additionalProperties: true }
    SATResultDetail:
      type: object
      properties:
        summary: { $ref: "#/components/schemas/ResultSummary" }
        scorePayload: { type: object, additionalProperties: true }
        sections: { type: array, items: { $ref: "#/components/schemas/SATSection" } }
    ACTScienceReport:
      type: object
      properties:
        attemptId: { type: string }
        totalScore: { type: integer }
        maxScore: { type: integer }
        percentage: { type: number }
        outcomeStatus:
          { type: string, enum: [scored, pending, invalidated_proctor, invalidated_timeout] }
        releaseStatus: { type: string }
    GradingTransition:
      type: object
      properties:
        submissionId: { type: string }
        from: { type: string }
        to: { type: string }
    ResultSummary:
      type: object
      properties:
        id: { type: string }
        submissionId: { type: string, nullable: true }
        attemptId: { type: string }
        providerKey: { type: string }
        scoreKind: { type: string, enum: [practice] }
        outcomeStatus: { type: string }
        totalScore: { type: integer, nullable: true }
        releaseStatus: { type: string }
        scheduleId: { type: string }
        examId: { type: string }
        examTitle: { type: string }
        versionNumber: { type: integer }
        studentId: { type: string }
        studentName: { type: string }
        studentEmail: { type: string, nullable: true }
        cohortName: { type: string }
        submittedAt: { type: string, format: date-time, nullable: true }
    DashboardResult:
      type: object
      required:
        [
          id,
          attemptId,
          providerKey,
          outcomeStatus,
          releaseStatus,
          studentId,
          studentName,
          scheduleId,
          examId,
          examTitle,
          cohortName,
          versionNumber,
        ]
      properties:
        id: { type: string }
        submissionId: { type: string, nullable: true }
        attemptId: { type: string }
        providerKey: { type: string, enum: [ielts, sat, act] }
        outcomeStatus:
          { type: string, enum: [scored, pending, invalidated_proctor, invalidated_timeout] }
        releaseStatus: { type: string }
        totalScore: { type: integer, nullable: true }
        maxScore: { type: integer, nullable: true }
        percentage: { type: number, nullable: true }
        overallBand: { type: number, nullable: true }
        sectionBands: { type: object, additionalProperties: { type: number }, nullable: true }
        studentId: { type: string }
        studentName: { type: string }
        studentEmail: { type: string, nullable: true }
        scheduleId: { type: string }
        examId: { type: string }
        examTitle: { type: string }
        cohortName: { type: string }
        institution: { type: string, nullable: true }
        versionNumber: { type: integer }
        submittedAt: { type: string, format: date-time, nullable: true }
    LegacyResultsExport:
      type: object
      required: [format, generatedAt, count, items]
      properties:
        format: { type: string, enum: [json] }
        generatedAt: { type: string, format: date-time }
        count: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/DashboardResult" }
