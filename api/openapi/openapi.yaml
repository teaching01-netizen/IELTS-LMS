  /student/sessions/{scheduleId}/device-transfers:
    post:
      tags: [student-v1]
      summary: Request a SAT device transfer (blocked browser)
      description: >-
        Student cookie session. Opens, or returns the identical outstanding,
        transfer request. Grants no writer or content access. One outstanding
        request per attempt; a different target conflicts.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId, attemptId, clientSessionId, expectedLeaseEpoch, reasonCode]
              properties:
                operationId: { type: string, minLength: 8, maxLength: 64 }
                attemptId: { type: string }
                clientSessionId: { type: string, maxLength: 36 }
                expectedLeaseEpoch: { type: integer, minimum: 1 }
                reasonCode: { type: string, pattern: "^[a-z0-9_]{1,64}$" }
      responses:
        "200":
          description: Request
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer: { $ref: "#/components/schemas/DeviceTransfer" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /student/sessions/{scheduleId}/device-transfers/{requestId}:
    get:
      tags: [student-v1]
      summary: SAT device-transfer status for its requester
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - name: clientSessionId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Request (lazy expiry applied; reads never extend expiry)
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer: { $ref: "#/components/schemas/DeviceTransfer" }
        "404": { $ref: "#/components/responses/Error" }
  /student/sessions/{scheduleId}/device-transfers/{requestId}/cancel:
    post:
      tags: [student-v1]
      summary: Cancel an uncommitted SAT device-transfer request
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - name: clientSessionId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Request (unchanged when already terminal)
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer: { $ref: "#/components/schemas/DeviceTransfer" }
        "404": { $ref: "#/components/responses/Error" }
  /student/sessions/{scheduleId}/device-transfers/{requestId}/commit:
    post:
      tags: [student-v1]
      summary: Redeem an approved SAT device transfer
      description: >-
        Atomically increments the lease, makes the target session the writer,
        revokes other sessions, and issues the target credential. Retrying a
        committed request recovers the credential only while the target still
        owns the resulting lease.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientSessionId]
              properties:
                clientSessionId: { type: string, maxLength: 36 }
      responses:
        "200":
          description: Committed or recovered
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer: { $ref: "#/components/schemas/DeviceTransfer" }
                  recovered: { type: boolean }
                  admission: { type: object, additionalProperties: true }
                  attemptId: { type: string }
                  attemptToken: { type: string }
                  attemptExpiresAt: { type: string, format: date-time }
                  clientSessionId: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /student/sessions/{scheduleId}/writer/device-transfer:
