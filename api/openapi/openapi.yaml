  /proctor/sessions/{scheduleId}/device-transfers/{requestId}/decision:
    post:
      tags: [proctor]
      summary: Approve or deny a SAT device-transfer request
      description: >-
        Approval binds the request's target session and expected owner/lease;
        ownership changes only when the target browser commits it. Approval
        requires acknowledging that unconfirmed answers on the old device do
        not transfer.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny] }
                reason: { type: string, maxLength: 255 }
                acknowledgeUnconfirmedRisk: { type: boolean }
      responses:
        "200":
          description: Decision recorded
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  transfer: { $ref: "#/components/schemas/DeviceTransfer" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
