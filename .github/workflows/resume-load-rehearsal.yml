name: SAT resume load rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm_production_load:
        description: Run the 100-student resume load against the configured production schedule.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sat-resume-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume-load:
    if: ${{ inputs.confirm_production_load }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-resume-load
    env:
      K6_CONFIRM_PROD: "true"
      K6_STUDENTS: "100"
      K6_TARGET_PATH: ${{ runner.temp }}/prod-target.json
      K6_CREDS_PATH: ${{ runner.temp }}/prod-creds.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Prepare protected target and credentials
        env:
          K6_RESUME_TARGET_JSON: ${{ secrets.K6_RESUME_TARGET_JSON }}
          K6_RESUME_CREDS_JSON: ${{ secrets.K6_RESUME_CREDS_JSON }}
        run: |
          set -euo pipefail
          test -n "$K6_RESUME_TARGET_JSON" || { echo "Missing K6_RESUME_TARGET_JSON in the production-resume-load environment."; exit 1; }
          test -n "$K6_RESUME_CREDS_JSON" || { echo "Missing K6_RESUME_CREDS_JSON in the production-resume-load environment."; exit 1; }
          umask 077
          printf '%s' "$K6_RESUME_TARGET_JSON" > "$K6_TARGET_PATH"
          printf '%s' "$K6_RESUME_CREDS_JSON" > "$K6_CREDS_PATH"

      - name: Run 100-student SAT resume rehearsal
        run: bun run k6:resume

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$K6_TARGET_PATH" "$K6_CREDS_PATH"
