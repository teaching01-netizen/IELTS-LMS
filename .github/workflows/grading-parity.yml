name: grading parity

on:
  pull_request:
    paths:
      - "src/components/admin/grading**"
      - "src/components/admin/__tests__/keySourceTable.test.ts"
      - "src/features/grading/**"
      - "src/utils/acceptedAnswers.ts"
      - "src/utils/sentenceCompletionAnswerPool.ts"
      - "src/utils/subAnswerTree.ts"
      - "src/utils/subAnswerTreeSlots.ts"
      - "src/utils/gradingGroups.ts"
      - "src/utils/multiSelectMcq.ts"
      - "src/services/examAdapterService.ts"
      - "e2e/ielts-*.spec.ts"
      - "e2e/helpers/ieltsGradingFixtures.ts"
      - "playwright.ielts-case.config.ts"
      - "backend/go/internal/grading/**"
      - "backend/go/internal/exams/**"
      - "backend/go/cmd/grading-parity-grade/**"
      - "backend/scripts/grading-parity.ts"
      - "testdata/objective-grading-parity/**"
      - "package.json"
      - "bun.lock"
      - "backend/go/go.mod"
      - "backend/go/go.sum"
      - ".github/workflows/grading-parity.yml"
  push:
    branches: [main]
    paths:
      - "src/**/grading**"
      - "src/utils/acceptedAnswers.ts"
      - "src/utils/sentenceCompletionAnswerPool.ts"
      - "src/utils/subAnswerTree.ts"
      - "src/utils/gradingGroups.ts"
      - "src/services/examAdapterService.ts"
      - "e2e/ielts-*.spec.ts"
      - "e2e/helpers/ieltsGradingFixtures.ts"
      - "playwright.ielts-case.config.ts"
      - "backend/go/internal/grading/**"
      - "testdata/objective-grading-parity/**"
      - ".github/workflows/grading-parity.yml"

jobs:
  go-grading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
      - name: Go grading + publish-key tests
        working-directory: backend/go
        run: go test -count=1 ./internal/grading ./internal/exams

  website-grading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: Shared answer-cleaning fixture
        run: bunx vitest run src/utils/__tests__/answerCleaningParity.test.ts src/utils/__tests__/acceptedAnswers.test.ts src/utils/__tests__/studentInputVectors.test.ts
      - name: Key-source table + objective scoring
        run: bunx vitest run src/components/admin/__tests__/gradingKeySources.test.ts src/components/admin/__tests__/keySourceTable.test.ts src/components/admin/__tests__/gradingAnswerDisplay.test.ts src/features/grading/__tests__/objectiveScoring.test.ts
      - name: Shared pool + grouped-slot contracts
        run: bunx vitest run src/utils/__tests__/sentenceCompletionAnswerPool.test.ts src/utils/__tests__/subAnswerTree.test.ts src/services/__tests__/examAdapterService.studentQuestions.test.ts
      - name: IELTS vertical-slice parity suites
        run: bun run e2e:ielts-case

  parity-report:
    runs-on: ubuntu-latest
    needs: [go-grading, website-grading]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: Golden expected results are current
        run: bun backend/scripts/build-grading-parity-fixture.ts --check
      - name: Replay the full-coverage exam through both graders
        run: |
          bun backend/scripts/grading-parity.ts \
            --fixture testdata/objective-grading-parity/full-coverage-exam.json \
            --label ci \
            --out /tmp/grading-parity-report.json \
            --fail-on-mismatch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grading-parity-report
          path: /tmp/grading-parity-report.json
