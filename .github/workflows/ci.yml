name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: Run the full 16-shard, seven-browser E2E suite
        type: boolean
        required: true
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # E2E checks can take close to two hours; don't cancel an active run on push.
  cancel-in-progress: false

jobs:
  go-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/go
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ielts
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      DATABASE_DIRECT_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      DATABASE_MIGRATOR_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      DATABASE_WORKER_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      API_HOST: 127.0.0.1
      PORT: 4000
      API_PORT: 4000
      APP_ENV: test
      ENVIRONMENT: test
      MIGRATIONS_DIR: migrations
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: session
      CSRF_COOKIE_NAME: csrf
      GRADING_PROJECTION_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 -coverprofile=$RUNNER_TEMP/coverage.out ./...

      - name: Build binaries
        run: go build ./cmd/api ./cmd/worker ./cmd/migrate

      - name: Race tests
        run: go test -race -count=1 ./internal/...

      - name: Check Go coverage threshold
        run: |
          # Go coverage ratchet gate (mirrors frontend 75% gate style): measured total 29.4%
          # via 'go tool cover -func=$RUNNER_TEMP/coverage.out' on the current tree; threshold = floor(29.4) - 2 = 27.
          # Intent is ratchet-only: fail-closed below threshold, raise the threshold as coverage improves.
          # Profile lives in $RUNNER_TEMP so no coverage.out artifact lands in the repo (do not commit it).
          threshold=27
          total=$(go tool cover -func=$RUNNER_TEMP/coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Go total coverage: ${total}% (threshold ${threshold}%)"
          if [ -z "$total" ]; then
            echo "Could not parse total coverage from $RUNNER_TEMP/coverage.out"
            exit 1
          fi
          if awk "BEGIN {exit !($total < $threshold)}"; then
            echo "Go coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi
          echo "Go coverage ${total}% meets threshold ${threshold}%"

      - name: Apply migrations
        run: go run ./cmd/migrate

      - name: Migration validation
        run: go run ./cmd/migrate --validate-only

      - name: Persistent login contracts (real MySQL, no skipped tests)
        env:
          TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
        run: |
          set -euo pipefail
          : "${TEST_MYSQL_DSN:?Persistent-login qualification requires isolated MySQL}"
          log="$RUNNER_TEMP/persistent-login-contracts.log"
          go test -race -count=1 -v ./internal/auth ./cmd/migrate \
            -run 'TestLogin|TestLookupLockedAdmission|TestReauthenticate|TestPasswordResetAtomicity|TestActivationMySQL|TestRevokeAllSerializes|TestPersistentSessionMigration' | tee "$log"
          go test -race -count=1 -v ./cmd/api \
            -run 'TestPersistentLogin|TestLoginRemember|TestRememberedStaff|TestAuthResponsesAreNoStore|TestCredentialRoutes|TestAnonymousLogout|TestSensitiveRouteManifest|TestReauthenticateRejects|TestStaffPolling' | tee -a "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "Persistent-login DB/process tests must execute; skipped tests fail qualification."
            exit 1
          fi

      - name: Capacity race and idempotency regressions (real MySQL)
        env:
          TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
        run: >-
          go test ./cmd/api -count=1
          -run '^(TestStartAndCheckInDoNotDeadlock|TestConcurrentCheckInRetryMintsOneAttemptMySQL|TestAuthoringFinalSlotRaceMySQL|TestAuthoringIdempotentReplayMySQL)$'

      - name: Integration tests (real MySQL)
        env:
          TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
        run: go test ./integration/ -v -count=1

      - name: SAT API contracts (real MySQL, no skipped tests)
        env:
          TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/sat-api-contracts.log"
          go test ./internal/platform/httpx -count=1 -v \
            -run '^TestDBRateLimiterFreshKeyMySQL$' | tee "$log"
          go test ./cmd/api -count=1 -v \
            -run '^(TestSAT|TestStudentRawContentRoutesFenceUnassignedBranch|TestK6SAT)' \
            | tee -a "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "SAT API contracts must execute against MySQL; a skipped test is not a pass."
            exit 1
          fi

      - name: Authoring lifecycle suites (real MySQL)
        env:
          TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
        run: |
          # The authoring contract suites (shell lifecycle, concurrent draft
          # open, nested-vs-bulk read equivalence, preview cache) are gated on
          # TEST_MYSQL_DSN and used to SKIP here, so the contract this repo
          # relies on was never actually executed in CI. Run them explicitly
          # and fail if any of them skips: a silent skip is indistinguishable
          # from a pass and is exactly how the suites rot.
          set -o pipefail
          log="$RUNNER_TEMP/authoring-contract.log"
          go test ./internal/authoring/ -count=1 -v \
            -run 'TestShell|TestOpenShell|TestEquivalence|TestBulk|TestPreview|TestAssembleShellTree' \
            | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "Authoring MySQL-backed suites reported SKIP; they must run in CI."
            exit 1
          fi

      - name: OpenAPI lint
        run: bunx @redocly/cli lint ../../api/openapi/openapi.yaml

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Schema diff guard
        run: go run ./cmd/migrate --validate-only && echo "schema-ledger-clean"

      - name: Git diff check
        run: git diff --check

  deployment-image-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ielts
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployment image
        run: |
          set -euo pipefail
          started=$SECONDS
          DOCKER_BUILDKIT=1 docker build --progress=plain --target runner \
            --file backend/Dockerfile --tag ielts-proctoring:ci . \
            2>&1 | tee "$RUNNER_TEMP/cold-image-build.log"
          echo "cold_image_build_seconds=$((SECONDS - started))"
          docker image inspect ielts-proctoring:ci --format='image_size_bytes={{.Size}}'
          docker run --rm --entrypoint du ielts-proctoring:ci -sh \
            /app/node_modules /app/frontend/dist

      - name: Verify the runtime dependency layer is production-only
        run: |
          docker run --rm --network host --entrypoint node ielts-proctoring:ci -e '
          const required = ["tsx", "mysql2/promise", "@hocuspocus/server", "@tiptap/core", "y-prosemirror", "yjs"];
          for (const name of required) require.resolve(name);
          for (const name of ["vite", "vitest", "storybook", "@tailwindcss/vite", "@vitejs/plugin-react", "typescript"]) {
            try {
              require.resolve(name);
              throw new Error(`${name} unexpectedly exists in the runtime image`);
            } catch (error) {
              if (error.code !== "MODULE_NOT_FOUND") throw error;
            }
          }
          console.log("co-edit runtime dependencies are present; build tools are absent");
          '

      - name: Measure unchanged build cache reuse
        run: |
          set -euo pipefail
          started=$SECONDS
          DOCKER_BUILDKIT=1 docker build --progress=plain --target runner \
            --file backend/Dockerfile --tag ielts-proctoring:ci . \
            2>&1 | tee "$RUNNER_TEMP/unchanged-image-build.log"
          echo "unchanged_image_build_seconds=$((SECONDS - started))"

      - name: Verify frontend and backend build cache boundaries
        shell: bash
        run: |
          set -euo pipefail
          cp src/main.tsx "$RUNNER_TEMP/cache-probe-main.tsx"
          cp backend/go/cmd/api/main.go "$RUNNER_TEMP/cache-probe-main.go"
          restore_cache_probe_sources() {
            cp "$RUNNER_TEMP/cache-probe-main.tsx" src/main.tsx
            cp "$RUNNER_TEMP/cache-probe-main.go" backend/go/cmd/api/main.go
          }
          trap restore_cache_probe_sources EXIT

          printf '\n' >> src/main.tsx
          started=$SECONDS
          DOCKER_BUILDKIT=1 docker build --progress=plain --target runner \
            --file backend/Dockerfile --tag ielts-proctoring:ci . \
            2>&1 | tee "$RUNNER_TEMP/frontend-only-image-build.log"
          echo "frontend_only_image_build_seconds=$((SECONDS - started))"
          if grep -E 'CACHED .*RUN bun run build' "$RUNNER_TEMP/frontend-only-image-build.log"; then
            echo "frontend source change unexpectedly reused the frontend build layer"
            exit 1
          fi
          cp "$RUNNER_TEMP/cache-probe-main.tsx" src/main.tsx

          printf '\n' >> backend/go/cmd/api/main.go
          started=$SECONDS
          DOCKER_BUILDKIT=1 docker build --progress=plain --target runner \
            --file backend/Dockerfile --tag ielts-proctoring:ci . \
            2>&1 | tee "$RUNNER_TEMP/backend-only-image-build.log"
          echo "backend_only_image_build_seconds=$((SECONDS - started))"
          if ! grep -E 'CACHED .*RUN bun run build' "$RUNNER_TEMP/backend-only-image-build.log"; then
            echo "backend-only source change unexpectedly rebuilt the frontend"
            exit 1
          fi

      - name: Exercise both runtime modes against MySQL
        shell: bash
        run: |
          set -euo pipefail
          database_url='mysql://root:root@127.0.0.1:3306/ielts?parseTime=true&multiStatements=true&charset=utf8mb4'

          for mode in activity_driven continuous; do
            container_name="ielts-proctoring-${mode}"
            docker run --detach --network host --name "$container_name" \
              --env APP_ENV=test \
              --env ENVIRONMENT=test \
              --env API_HOST=127.0.0.1 \
              --env API_PORT=4000 \
              --env PORT=4000 \
              --env COOKIE_SECURE=false \
              --env MIGRATIONS_DIR=/app/migrations \
              --env DATABASE_URL="$database_url" \
              --env DATABASE_DIRECT_URL="$database_url" \
              --env DATABASE_MIGRATOR_URL="$database_url" \
              --env DATABASE_WORKER_URL="$database_url" \
              --env AUTH_SECRET=test-auth-secret-with-more-than-32-characters \
              --env BACKGROUND_RUNTIME_MODE="$mode" \
              --env AUTHORING_COEDIT_ENVIRONMENT=test \
              --env AUTHORING_COEDIT_MYSQL_DSN="$database_url" \
              --env AUTHORING_COEDIT_TOKEN_SECRET=test-coedit-token-secret-with-32-bytes \
              --env AUTHORING_COEDIT_SERVICE_SECRET=test-coedit-service-secret-with-32-bytes \
              --env AUTHORING_COEDIT_GO_BASE_URL=http://127.0.0.1:4000 \
              ielts-proctoring:ci

            ready=0
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:4000/readyz >/dev/null 2>&1; then
                if [ "$mode" = activity_driven ]; then
                  if curl --fail --silent http://127.0.0.1:1235/readyz >/dev/null 2>&1; then
                    echo "activity-driven co-edit service should start parked"
                    break
                  fi
                  if ! curl --fail --silent http://127.0.0.1:1235/healthz >/dev/null 2>&1; then
                    sleep 2
                    continue
                  fi
                elif ! curl --fail --silent http://127.0.0.1:1235/readyz >/dev/null 2>&1; then
                  sleep 2
                  continue
                fi
                ready=1
                break
              fi
              if [ "$(docker inspect --format='{{.State.Running}}' "$container_name")" != true ]; then
                break
              fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then
              docker logs "$container_name"
              exit 1
            fi

            docker stop --time 25 "$container_name"
            exit_code="$(docker inspect --format='{{.State.ExitCode}}' "$container_name")"
            if [ "$exit_code" != 0 ]; then
              docker logs "$container_name"
              echo "container exited with status $exit_code during graceful shutdown"
              exit 1
            fi
            docker rm "$container_name"
          done

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Co-edit service tests
        run: bun run coedit:test

      - name: Co-edit service typecheck
        run: bun run coedit:typecheck

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck migrated staff tests
        run: bun run typecheck:staff-tests

      - name: Lint
        run: bun run lint

      - name: Format Check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="origin/${{ github.base_ref }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only "$base" HEAD -- \
            ':(glob)src/**/*.{ts,tsx}' \
            ':(glob)e2e/**/*.ts' \
            ':(glob)playwright*.config.ts')
          if (( ${#files[@]} == 0 )); then
            echo "No changed TypeScript files require formatting checks."
          else
            bunx prettier --check "${files[@]}" --config .prettierrc
          fi

      - name: Test with Coverage
        run: bun run test:coverage

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

      - name: Check Coverage Threshold
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const threshold = 75;
          const report = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'));
          let covered = 0;
          let total = 0;

          // The gate measures shipped product code (src/). Config, e2e
          // harnesses, load scripts, and generated tooling are exercised by
          // other jobs (typecheck/build/e2e/k6) and must not dilute or
          // inflate the unit-test coverage signal. Test files and stories
          // are excluded here as well as in vitest.config.ts so the gate
          // stays honest even if coverage is generated with other flags:
          // tests cover themselves at ~100% and stories at ~0%.
          const excluded = (path) =>
            !path.includes('/src/') ||
            path.endsWith('.test.ts') || path.endsWith('.test.tsx') ||
            path.includes('__tests__') ||
            path.endsWith('.stories.ts') || path.endsWith('.stories.tsx');
          for (const [path, file] of Object.entries(report)) {
            if (excluded(path)) continue;
            for (const count of Object.values(file.s ?? {})) {
              total += 1;
              if (count > 0) covered += 1;
            }
          }

          if (total === 0) {
            throw new Error('Coverage report contains no statement data');
          }

          const coverage = (covered / total) * 100;
          if (coverage < threshold) {
            console.error(`Coverage ${coverage.toFixed(2)}% is below threshold ${threshold}%`);
            process.exit(1);
          }
          console.log(`Coverage ${coverage.toFixed(2)}% meets threshold ${threshold}%`);
          NODE

      - name: Generated client freshness
        run: bunx @redocly/cli lint api/openapi/openapi.yaml

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No tracked k6 creds
        run: |
          if git ls-files | grep -E "creds\.json$" | grep -v "example"; then
            echo "Non-example *creds.json files are tracked; untrack them (git rm --cached) and commit only *.creds.example.json templates."
            exit 1
          fi
          echo "No tracked non-example creds files."

      - name: Build
        run: bun run build

      - name: Student bundle isolation
        run: node scripts/assert-student-bundle-isolation.mjs

      - name: Analyze Bundle Size
        run: |
          entry_assets=()
          while IFS= read -r asset; do
            entry_assets+=("$asset")
          done < <(grep -oE '/assets/[^" ]+' dist/index.html | sed 's#^/assets/##')
          if (( ${#entry_assets[@]} == 0 )); then
            echo "No entry assets found in dist/index.html"
            exit 1
          fi

          BUNDLE_SIZE_BYTES=0
          for asset in "${entry_assets[@]}"; do
            asset_path="dist/assets/$asset"
            if [[ ! -f "$asset_path" ]]; then
              echo "Missing entry asset: $asset_path"
              exit 1
            fi
            asset_bytes=$(gzip -c "$asset_path" | wc -c | tr -d ' ')
            BUNDLE_SIZE_BYTES=$((BUNDLE_SIZE_BYTES + asset_bytes))
          done

          echo "Initial compressed bundle size: ${BUNDLE_SIZE_BYTES} bytes"
          # Alert if the entry bundle exceeds 500 KiB; lazy chunks are loaded on demand.
          if (( BUNDLE_SIZE_BYTES > 524288 )); then
            echo "Initial compressed bundle exceeds 500 KiB"
            exit 1
          fi

  e2e-test-shards:
    name: e2e-tests (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/16"
            label: 1-of-16
          - shard: "2/16"
            label: 2-of-16
          - shard: "3/16"
            label: 3-of-16
          - shard: "4/16"
            label: 4-of-16
          - shard: "5/16"
            label: 5-of-16
          - shard: "6/16"
            label: 6-of-16
          - shard: "7/16"
            label: 7-of-16
          - shard: "8/16"
            label: 8-of-16
          - shard: "9/16"
            label: 9-of-16
          - shard: "10/16"
            label: 10-of-16
          - shard: "11/16"
            label: 11-of-16
          - shard: "12/16"
            label: 12-of-16
          - shard: "13/16"
            label: 13-of-16
          - shard: "14/16"
            label: 14-of-16
          - shard: "15/16"
            label: 15-of-16
          - shard: "16/16"
            label: 16-of-16
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ielts
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      DATABASE_DIRECT_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      DATABASE_MIGRATOR_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      DATABASE_WORKER_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      TEST_DATABASE_URL: "mysql://root:root@127.0.0.1:3306/ielts"
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      # E2E scrapes the private Prometheus endpoint with this test-only bearer token.
      METRICS_TOKEN: "ci-only-e2e-metrics-token"
      API_HOST: 127.0.0.1
      PORT: 4000
      API_PORT: 4000
      APP_ENV: test
      ENVIRONMENT: test
      MIGRATIONS_DIR: migrations
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: session
      CSRF_COOKIE_NAME: csrf
      GRADING_PROJECTION_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: bunx playwright install --with-deps

      - name: Build
        run: bun run build

      - name: Apply migrations for E2E
        working-directory: backend/go
        run: go run ./cmd/migrate

      - name: Run E2E Tests
        run: |
          # Each browser project and each selected test file gets its own
          # globalSetup/seed cycle. A test file can terminalize or pause a
          # schedule, so sharing one destructive MySQL fixture across files
          # makes later files inherit the earlier file's state. Balance whole
          # files by test count because native file sharding leaves some shards
          # empty and gives others more than twice the work. The actual file run
          # omits --shard because each whole file has already been assigned.
          projects=(chromium mobile-chromium mobile-webkit tablet-portrait tablet-landscape firefox webkit)
          E2E_SHARD="${{ matrix.shard }}"
          status=0
          for project in "${projects[@]}"; do
            test_list=$(bunx playwright test --project="${project}" --list 2>/dev/null)
            selected_files=$(printf '%s\n' "$test_list" | node scripts/ci/assign-e2e-files-to-shards.mjs "$E2E_SHARD")
            mapfile -t files <<< "$selected_files"
            if ((${#files[@]} == 0)); then
              echo "No E2E files assigned to ${project} in shard ${{ matrix.shard }}"
              exit 1
            fi
            for file in "${files[@]}"; do
              safe_file="${file//\//__}"
              safe_file="${safe_file//./_}"
              echo "Running E2E file: ${project} ${file}"
              if ! PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/${project}/${safe_file}" \
                bunx playwright test "${file}" --project="${project}"; then
                status=1
              fi
            done
          done
          exit "$status"

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.label }}
          path: playwright-report/
          retention-days: 30

  e2e-tests:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_full_e2e
    needs: e2e-test-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all E2E shards passed
        run: |
          if [[ "${{ needs.e2e-test-shards.result }}" != "success" ]]; then
            echo "E2E shard result: ${{ needs.e2e-test-shards.result }}"
            exit 1
          fi
          echo "All E2E shards passed."

  # Short, isolated IELTS + ACT browser journeys are required before every
  # Railway deploy. The database and all seeded records are job-local CI data.
  release-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ielts
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      DATABASE_DIRECT_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      DATABASE_MIGRATOR_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      DATABASE_WORKER_URL: "root:root@tcp(127.0.0.1:3306)/ielts?parseTime=true&multiStatements=true&charset=utf8mb4"
      TEST_DATABASE_URL: "mysql://root:root@127.0.0.1:3306/ielts"
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      METRICS_TOKEN: "ci-only-e2e-metrics-token"
      API_HOST: 127.0.0.1
      PORT: 4000
      API_PORT: 4000
      APP_ENV: test
      ENVIRONMENT: test
      MIGRATIONS_DIR: migrations
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: session
      CSRF_COOKIE_NAME: csrf
      GRADING_PROJECTION_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Apply migrations for smoke tests
        working-directory: backend/go
        run: go run ./cmd/migrate

      - name: Run IELTS and ACT browser smoke journeys
        run: >-
          bunx playwright test
          e2e/full-lifecycle.spec.ts
          e2e/act-science-workflow.spec.ts
          --project=chromium
          --grep 'completes full exam lifecycle from registration to grading|renders, saves, terminalizes, scores, and reports an ACT Science attempt'

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-smoke
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The authoring lifecycle gate (plan Phase 16).
  #
  # Deliberately its OWN job with NO database and NO Go build: the suite answers
  # the transport itself and runs against `vite dev` alone. That is the point —
  # the plan's mandatory regression (a pre-draft exam must read 200 NO_DRAFT,
  # issue zero POSTs, and print nothing to the console) is a BROWSER property,
  # and it must not be able to disappear because the backend harness could not
  # start, or because a MySQL service was unavailable on some day.
  sat-authoring-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium

      - name: Run authoring lifecycle suite
        run: bunx playwright test --config=playwright.sat-authoring.config.ts

      - name: Upload authoring lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-sat-authoring
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  performance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run Performance Tests
        run: bun run test:performance

      - name: Start preview server for Lighthouse
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/lighthouse-preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/lighthouse-preview.log"
          exit 1

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://127.0.0.1:4173/
          uploadArtifacts: false
          temporaryPublicStorage: true

  railway-deploy:
    runs-on: ubuntu-latest
    needs: [quality-gates, go-backend, release-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Railway CLI
        run: bun install -g @railway/cli

      - name: Install
        run: bun install --frozen-lockfile

      - name: Deploy to Railway
        run: railway up --service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify Railway readiness (read-only)
        run: |
          host="$(railway domain --service)"
          url="https://${host#https://}"
          url="${url%/}/readyz"
          echo "Waiting for Railway readiness at ${url}..."
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --retry 10 --retry-all-errors --retry-delay 6 --retry-max-time 180 \
            "$url"
