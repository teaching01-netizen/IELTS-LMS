[package]
name = "ielts-backend-application"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
base64 = "0.22.1"
calamine = { version = "0.36.1", features = ["picture"] }
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
ielts-backend-domain = { path = "../domain", features = ["sqlx"] }
ielts-backend-infrastructure = { path = "../infrastructure" }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
sha2 = "0.10.8"
rust_xlsxwriter = "0.99.0"
sqlx = { version = "0.7.4", features = ["mysql", "runtime-tokio-rustls", "uuid", "chrono"] }
thiserror = "1.0.69"
tracing = "0.1.41"
uuid = { version = "1.11.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "time"] }
axum = { version = "0.7.9", features = ["ws"] }

[[test]]
name = "mutation_replay"
path = "../../tests/integration/mutation_replay.rs"

[[test]]
name = "exam_lifecycle"
path = "../../tests/integration/exam_lifecycle.rs"

[[test]]
name = "registration_flow"
path = "../../tests/integration/registration_flow.rs"

[[test]]
name = "revision_tracking"
path = "../../tests/integration/revision_tracking.rs"

[[test]]
name = "submission_unanswered_policy"
path = "../../tests/integration/submission_unanswered_policy.rs"

[[test]]
name = "sat_adaptive_runtime"
path = "../../tests/integration/sat_adaptive_runtime.rs"

[[test]]
name = "response_durability_v2_proof_tests"
path = "../../tests/integration/response_durability_v2_proof_tests.rs"
