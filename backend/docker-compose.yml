services:
  tidb:
    image: pingcap/tidb:latest
    restart: unless-stopped
    environment:
      TIDB_ROOT_PASSWORD: root
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tidb_data:/var/lib/tidb

volumes:
  tidb_data:
