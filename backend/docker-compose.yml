services:
  tidb:
    image: pingcap/tidb:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10080/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tidb_data:/var/lib/tidb

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  tidb_data:
  minio_data:
