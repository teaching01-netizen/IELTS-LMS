groups:
  - name: ielts-student-answer-integrity
    rules:
      # NOTE (WS-10a): the previous expr referenced a student-answer loss-risk
      # series that no backend emits (no IncCounter/SetGauge call site). Rewritten to
      # terminal_invariant_violation_total — the real invariant-violation signal
      # (terminalization/service.go). If a dedicated loss-risk counter is added
      # later, point this rule at it and extend the registry-parity test.
      - alert: StudentAnswerLossRiskDetected
        expr: increase(terminal_invariant_violation_total[5m]) > 0
        for: 2m
        labels:
          severity: page
          slo: answer-integrity
        annotations:
          summary: "Student answer integrity risk signal detected"
          description: "Terminal-state invariant violations observed in the last 5 minutes. Check terminal_invariant_violation_total{name} and the worker logs."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # NOTE (WS-10a): the previous submit-replay-incomplete series was never
      # emitted by any backend. Rewritten to terminalization_conflict_total — the real seal-time conflict
      # signal (terminalization/service.go: terminalization_conflict_total).
      - alert: SubmitReplayIncompleteDetected
        expr: increase(terminalization_conflict_total[5m]) > 0
        for: 2m
        labels:
          severity: page
          slo: answer-integrity
        annotations:
          summary: "Seal-time conflicts detected"
          description: "Terminalization conflicts at seal time. Investigate mutation flush lag and concurrent seal attempts."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      - alert: RateLimitAuthCriticalDenials
        expr: increase(http_ratelimit_denied_total{tier="auth-critical"}[5m]) > 0
        for: 2m
        labels:
          severity: page
          slo: auth-availability
        annotations:
          summary: "Auth-critical rate-limit denials detected"
          description: "Session/logout reads are being denied. This is a misconfiguration or attack — never fix by raising only this tier without checking the tier table. See docs/runbooks/exam-day-mysql-scale.md."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      - alert: RateLimitTierBurnRate
        expr: increase(http_ratelimit_denied_total[10m]) >= 50
        for: 5m
        labels:
          severity: warning
          slo: api-availability
        annotations:
          summary: "Rate-limit denials elevated"
          description: "Check http_ratelimit_denied_total by tier/key_class to find the hot tier, then tune that tier's RATE_LIMIT_*_PER_MIN knob. Do not raise RATE_LIMIT_GLOBAL (single-global mode is removed)."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # NOTE (WS-10a): the previous post-submit grace-rejected series was never
      # emitted by any backend. Rewritten to v2_response_batch_total{outcome="not_writable"} — the real
      # post-terminal/deadline rejection signal (attempts/service.go
      # v2BatchOutcome: ATTEMPT_NOT_WRITABLE/DEADLINE_EXPIRED/PROCTOR_BLOCKED).
      - alert: PostSubmitGraceRejectedSpike
        expr: increase(v2_response_batch_total{outcome="not_writable"}[10m]) >= 20
        for: 5m
        labels:
          severity: warning
          slo: answer-integrity
        annotations:
          summary: "Post-submit rejections elevated"
          description: "Writes rejected against non-writable attempts (sealed/expired/blocked). Check network delay and client flush behavior."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # Readyz failures are observable via the AccessLog HTTP series. The
      # probe route is registered with the "GET /readyz" template
      # (main.go authorize wrapper), and AccessLog back-reports inner
      # WithRoute templates through the route holder, so the label is the
      # template — never the raw path.
      - alert: ReadyzProbeFailing
        expr: increase(http_requests_total{route="GET /readyz",status="5xx"}[5m]) > 0
        for: 2m
        labels:
          severity: page
          slo: api-availability
        annotations:
          summary: "Readiness probe failing"
          description: "The /readyz probe is returning 5xx (DB ping or schema-version check failing). The orchestrator will restart/reroute; check MySQL health and pool saturation."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # WS-10a: the worker reports outbox_oldest_age_seconds every drain
      # (cmd/worker/main.go). A growing oldest age means the relay is stalled.
      - alert: OutboxOldestAgeHigh
        expr: outbox_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: page
          slo: answer-integrity
        annotations:
          summary: "Outbox relay stalled"
          description: "Oldest pending outbox event is over 5 minutes old. Check worker liveness, claim mode, and DB contention."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # SAT authoring: conflict burn across save/create/batch/bulk/commit/
      # publish (authoring_operation_total{outcome="version_collision"}).
      # Sustained conflicts mean two authors are racing the same draft — page
      # so the on-call can check whether an import or bulk job is colliding
      # with live editing, not a backend fault.
      - alert: AuthoringConflictBurnRate
        expr: increase(authoring_operation_total{outcome="version_collision"}[10m]) >= 10
        for: 5m
        labels:
          severity: warning
          slo: authoring-availability
        annotations:
          summary: "Authoring conflicts elevated"
          description: "Stale-revision conflicts elevated over the last 10 minutes. Break down authoring_operation_total by operation to find the colliding surface (save_revision, bulk, workbook_commit, publish). Check for a concurrent import or bulk job racing live editing."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # SAT authoring: rejection burn (validation + authz + service faults).
      - alert: AuthoringRejectionBurnRate
        expr: increase(authoring_operation_total{outcome="rejected"}[10m]) >= 50
        for: 5m
        labels:
          severity: warning
          slo: authoring-availability
        annotations:
          summary: "Authoring rejections elevated"
          description: "Authoring mutation rejections elevated over the last 10 minutes. Break down authoring_operation_total by operation/outcome; rejections include validation failures, capacity fences, and permission denials."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # Exam-day SAT: legacy-fallback scoring means V2-saved answers are not
      # reaching the scorer (delivery/start_submit.go sat_score_source_total).
      # Any sustained legacy scoring post-fix is a scoring-disconnect
      # regression — page, do not ignore.
      - alert: SATLegacyScoringFallbackDetected
        expr: increase(sat_score_source_total{source="legacy"}[10m]) > 0
        for: 5m
        labels:
          severity: page
          slo: answer-integrity
        annotations:
          summary: "SAT scoring fell back to legacy rows"
          description: "SAT module scoring used legacy assessment_question_responses rows over the last 10 minutes. Break down sat_score_source_total by source; a nonzero legacy rate after the V2-canonical rollout means V2 answers are not reaching the scorer (finding 1 regression)."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # Exam-day re-audit defect 5: partial migration gaps hide under the v2
      # pass series (a mixed pass emits only source="v2"). The per-row
      # fallback series pages on ANY legacy gap inside a V2-owned pass
      # (source="legacy") or on a zero-answer pass where neither source
      # answered any question (source="zero": mass fencing/transport loss).
      - alert: SATMixedScoringFallbackDetected
        expr: increase(sat_score_fallback_rows_total[10m]) > 0
        for: 5m
        labels:
          severity: page
          slo: answer-integrity
        annotations:
          summary: "SAT scoring answered rows from legacy gaps"
          description: "SAT module scoring filled per-question gaps from legacy rows inside V2-owned passes (source=legacy), or scored a pass with zero answered rows from either source (source=zero: mass lease-fencing or transport loss). Break down sat_score_fallback_rows_total by source; any nonzero rate means V2 answers are missing for questions the scorer expected."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # Exam-day re-audit observability residual: backend-observed terminal
      # finalization outcomes (sat/service.go sat_finalize_total). A nonzero
      # rejected rate during the exam window means students are hitting
      # finalize failures the frontend beacons may never report (outage).
      - alert: SATFinalizationRejectedSpike
        expr: increase(sat_finalize_total{outcome="rejected"}[10m]) > 0
        for: 5m
        labels:
          severity: page
          slo: answer-integrity
        annotations:
          summary: "SAT terminal finalizations rejected"
          description: "SAT CompleteAssessment rejected terminal finalize calls over the last 10 minutes. Break down sat_finalize_total by outcome (completed/replayed/rejected); a nonzero rejected rate means finalize failures need the directions-phase retry path and the reconcile watchdog."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

      # WS-10a: server-error burn across all routes (AccessLog status class).
      - alert: HTTP5xxRateHigh
        expr: increase(http_requests_total{status="5xx"}[5m]) >= 50
        for: 5m
        labels:
          severity: warning
          slo: api-availability
        annotations:
          summary: "Server error rate elevated"
          description: "5xx responses elevated over the last 5 minutes. Break down http_requests_total by route/method to find the hot endpoint."
          runbook_url: "docs/runbooks/exam-day-mysql-scale.md"

  # Phase 06: SAT authoring realtime (durable events, delivery, presence,
  # divergence). Every series below is registered in
  # backend/go/internal/platform/telemetry/telemetry.go, and
  # cmd/api/alert_parity_test.go fails the build if a rule points at a series
  # nothing emits.
  #
  # Cardinality rule for every rule here: labels are bounded sets only. Exam,
  # draft, question, user, and connection ids never appear in a series, so no
  # rule can be written against one.
  - name: sat-authoring-realtime
    rules:
      # An in-tx append failure rolls the mutation back with it, so this is
      # correctness-adjacent rather than a bus-health nicety: authors are
      # getting failed saves. This is the PERSISTENCE series, deliberately
      # separate from delivery failures below.
      - alert: AuthoringEventAppendFailing
        expr: increase(authoring_event_publish_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: page
          slo: authoring-save-availability
        annotations:
          summary: "Authoring realtime event append is failing"
          description: "authoring_publish_failure_total{stage=\"append\"} moved, which means authoring mutations are rolling back. Correlate with authoring_operation_total{outcome=\"rejected\"}; flip AUTHORING_REALTIME_EVENTS off to stop writing event rows while HTTP editing stays functional."
          runbook_url: "docs/runbooks/sat-authoring-realtime-rollout.md"

      # A DETECTED invariant break. Note the framing: this pages on a violation
      # that code actually OBSERVED, and its silence is NOT proof of
      # correctness — a stale write is dangerous precisely because buggy code
      # may not know it won. The guarantee comes from revision fencing,
      # database constraints, and the concurrency/property suites.
      - alert: AuthoringInvariantViolation
        expr: increase(authoring_invariant_violations_total[15m]) > 0
        for: 0m
        labels:
          severity: page
          slo: authoring-data-integrity
        annotations:
          summary: "Authoring correctness invariant violated"
          description: "authoring_invariant_violations_total is nonzero, so a post-condition check observed an impossible state. Halt the realtime rollout (flip AUTHORING_REALTIME_DELIVERY and AUTHORING_REALTIME_EVENTS off) and treat as a data-integrity incident."
          runbook_url: "docs/runbooks/sat-authoring-realtime-rollout.md"

      # Conflicts are EXPECTED under collaboration, so this is a ticket, not a
      # page: a spike means UX pressure (or a fencing regression to triage in
      # logs via the revision_fenced lines).
      - alert: AuthoringRevisionConflictSpike
        expr: increase(authoring_revision_conflicts_total[10m]) > 25
        for: 10m
        labels:
          severity: warning
          slo: authoring-collaboration
        annotations:
          summary: "Authoring revision conflicts elevated"
          description: "Fenced authoring writes are above the expected collaboration baseline. Break down by operation to find whether one workflow (bulk/import/publish) is driving it, and check the divergence UX funnel."
          runbook_url: "docs/runbooks/sat-authoring-realtime-rollout.md"

      # THE freshness SLI. A resync means we could not keep a client fresh and it
      # had to refetch authoritative state. Note what is NOT measured: there is
      # no sequence-gap series, because the cursor is global and filtered and a
      # skipped value is normal (it belongs to another exam or kind). Break the
      # reason label down in the description rather than inventing gap math.
      - alert: AuthoringResyncPressureHigh
        expr: increase(authoring_resync_total[10m]) > 10
        for: 10m
        labels:
          severity: warning
          slo: authoring-freshness
        annotations:
          summary: "Authoring clients are resyncing too often"
          description: "Clients are falling back to authoritative refetches. Break down authoring_resync_total by reason: delivery_overflow points at capacity (see the drop series), replay_too_large at the replay bound, unsupported_event at version skew, lifecycle_rebind at publish/undo churn."
          runbook_url: "docs/runbooks/sat-authoring-realtime-rollout.md"

      # cursor_expired is the retention-vs-offline mismatch signal: clients are
      # coming back after the 72h replay window. The cover is the resync path; a
      # sustained rate means the window or client behavior needs review.
      - alert: AuthoringCursorExpiredSustained
        expr: increase(authoring_resync_total{reason="cursor_expired"}[15m]) > 5
        for: 15m
        labels:
          severity: warning
          slo: authoring-delivery
        annotations:
          summary: "Authoring cursors are falling outside the retention window"
          description: "Clients are resuming with a cursor older than the 72h authoring retention window and recovering via snapshot. Confirm AuthoringRetentionHours still matches the wired live-bus purge window, then review offline durations."
          runbook_url: "docs/runbooks/sat-authoring-realtime-rollout.md"

      # A shed frame means a slow consumer. The client resyncs and writers are
      # never backpressured, so this is a capacity review (QueueCap, bandwidth,
      # or one pathological author) rather than an outage.
      - alert: AuthoringDeliveryOverflow
        expr: increase(authoring_ws_events_dropped_total{stage="hub_queue_full"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          slo: authoring-delivery
        annotations:
          summary: "Authoring hub is shedding events for slow clients"
          description: "The authoring hub dropped events because a subscriber queue was full. Writers were not blocked. Check authoring_ws_connections_current and authoring_ws_disconnects_total{reason=\"slow_client\"} for the affected cohort."
          runbook_url: "docs/runbooks/sat-authoring-realtime-rollout.md"

      # Transport failures are separate from persistence failures: canonical
      # state is still correct here, a client just reconnects and resyncs. The
      # cursor does not advance past unpolled rows, so a forwarder error
      # self-heals on the next tick.
      - alert: AuthoringDeliveryFailures
        expr: increase(authoring_delivery_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          slo: authoring-delivery
        annotations:
          summary: "Authoring events are failing to reach clients"
          description: "authoring_delivery_failures_total moved: break down by stage. forwarder failures mean this instance is not relaying other instances' events (it should self-heal next tick); socket failures mean frames were lost to a client that will reconnect and resync. Canonical state is unaffected either way."
          runbook_url: "docs/runbooks/sat-authoring-realtime-rollout.md"

      # Reconnect storms are the deploy-restart signature. Stage 7 halts the
      # ramp on this, because a storm is how a rollout turns into an outage.
      - alert: AuthoringReconnectStorm
        expr: increase(authoring_reconnects_total{outcome="snapshot_required"}[2m]) > 20
        for: 2m
        labels:
          severity: page
          slo: authoring-delivery
        annotations:
          summary: "Authoring reconnect storm"
          description: "Authoring clients are resubscribing and being forced to snapshot at a deploy-storm rate. If this follows a deploy, HALT the rollout ramp (see the stage 7 auto-halt gate) and verify clients resume via cursor rather than snapshot."
          runbook_url: "docs/runbooks/sat-authoring-realtime-rollout.md"

      # The delivery SLO as a real percentile. The series is emitted as fixed
      # cumulative buckets (le label), because the rollout gate is a p95 and a
      # last-sample gauge cannot produce one.
      - alert: AuthoringDeliveryLatencyP95High
        expr: histogram_quantile(0.95, sum(rate(authoring_delivery_latency_seconds[10m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
          slo: authoring-freshness
        annotations:
          summary: "Authoring delivery latency p95 above the 5s worst-case SLO"
          description: "Authoring event freshness p95 exceeded 5s. Check the forwarder poll cadence, event-table growth, and db_pool_wait before widening the latency budget."
          runbook_url: "docs/runbooks/sat-authoring-realtime-rollout.md"
